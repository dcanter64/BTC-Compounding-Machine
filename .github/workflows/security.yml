name: Security and tests

on:
  push:
  pull_request:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade package installer
        run: python -m pip install --upgrade pip
      - name: Install project and audit tools
        run: python -m pip install --requirement requirements.txt pip-audit
      - name: Run tests
        run: python -m pytest -q
      - name: Audit dependencies
        run: python -m pip_audit --requirement requirements.txt --progress-spinner off
